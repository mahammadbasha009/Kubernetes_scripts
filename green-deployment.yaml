apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-green
  labels:
    app: myyapp
    version: green

spec:
  replicas: 3

  selector:
    matchLabels:
      app: myyapp
      version: green

  template:
    metadata:
      labels:
        app: myyapp
        version: green

    spec:
      containers:
        - name: myyapp
          image: hanvitha/myyapp:v2
          ports:
            - containerPort: 8000
