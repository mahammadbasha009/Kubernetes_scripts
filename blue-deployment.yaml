apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-blue
  labels:
    app: myapp
    version: blue

spec:
  replicas: 3

  selector:
    matchLabels:
      app: myapp
      version: blue

  template:
    metadata:
      labels:
        app: myapp
        version: blue

    spec:
      containers:
        - name: myyapp
          image: hanvitha/myyapp:v1
          ports:
            - containerPort: 8000
